name: Links

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/links.yml"]
  pull_request:
    paths: ["**/*.md", ".github/workflows/links.yml"]
  schedule:
    # Weekly full external sweep (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so an upstream CLI change cannot silently break the checks.
  # Bump deliberately and re-run the workflow manually to confirm.
  LYCHEE_VERSION: v0.24.2

jobs:
  internal:
    name: Internal links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check relative links and heading anchors (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: ${{ env.LYCHEE_VERSION }}
          # Offline: validates local files and in-page fragments only.
          # Deterministic — this is what gates pull requests.
          args: --offline --include-fragments "**/*.md"
          fail: true

  external:
    name: External links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Check external URLs
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: ${{ env.LYCHEE_VERSION }}
          # 403/429 are common when publishers block bots; treat as reachable
          # rather than broken. Retries absorb transient failures.
          args: >-
            --accept 100..=103,200..=299,403,429
            --max-retries 2
            --retry-wait-time 5
            "**/*.md"
          output: lychee/out.md
          # Do not fail here: broken external links are reported as an issue
          # below, and the final step fails the run so the problem is visible.
          fail: false

      # lychee exits 2 when links are broken; other non-zero codes are tool or
      # config errors (the failure mode that previously went unnoticed).
      - name: Open or update the link report issue
        if: steps.lychee.outputs.exit_code == 2
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Link report: broken external links"
        run: |
          gh label create broken-link --color d93f0b --description "Dead or outdated link" --force
          number=$(gh issue list --state open --label broken-link --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file lychee/out.md
          else
            gh issue create --title "$TITLE" --label broken-link --body-file lychee/out.md
          fi

      - name: Fail if links are broken or lychee errored
        if: steps.lychee.outputs.exit_code != 0
        run: |
          echo "lychee exited with code ${{ steps.lychee.outputs.exit_code }}; see the job summary and the link report issue."
          exit 1
