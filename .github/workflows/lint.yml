name: Lint

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".github/**", "scripts/**"]
  pull_request:
    paths: ["**/*.md", ".github/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entries:
    name: README entries and list sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Stdlib-only Python; the runner's python3 is enough.
      - name: Test the checker
        run: python3 -m unittest discover -s scripts
      - name: Check README entries
        run: python3 scripts/check_readme.py
